<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8"/>
  <title>Show Recipe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous"
        th:href="@{/webjars/bootstrap/5.1.3/css/bootstrap.min.css}">

  <script
          src="https://code.jquery.com/jquery-3.6.0.min.js"
          integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
          crossorigin="anonymous" th:src="@{/webjars/jquery/3.6.0/jquery.min.js}"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
          crossorigin="anonymous" th:src="@{/webjars/bootstrap/5.1.3/js/bootstrap.min.js}"></script>
</head>
<body>
<div class="container-fluid" style="margin-top: 20px">
  <div class="row justify-content-center">
    <div class="col-md-6 col-md-offset-3">
      <div class="panel-group">
        <div class="card card-primary border border-primary" style="margin: 20px 0">
          <div class="card-header bg-primary text-light">
            <h7 class="card-title" th:text="${recipe.description}">Recipe Description Here!</h7>
          </div>
          <div class="card-body">
            <div class="row justify-content-center">
              <div class="col-md-3">
                <h7>Categories:</h7>
              </div>
              <div class="col-md-9">
                <tr th:each="category : ${recipe.categories}">
<!--                  <p><td th:text="${category.description}">123</td></p>-->
                  <li th:text="${category.description}">123</li>
                </tr>
              </div>
            </div>
            <div class="row justify-content-center">
              <div class="col-md-3">
                <h7>Prep Time:</h7>
              </div>
              <div class="col-md-3">
                <p th:text="${recipe.prepTime} + ' min'"></p>
              </div>
              <div class="col-md-3">
                <h7>Difficulty:</h7>
              </div>
              <div class="col-md-3">
                 <p th:text="${recipe.difficulty}"></p>
              </div>
            </div>
            <div class="row justify-content-center">
              <div class="col-md-3">
                <h7>Cooktime:</h7>
              </div>
              <div class="col-md-3">
                <p th:text="${recipe.cookTime} + ' min'"></p>
              </div>
              <div class="col-md-3">
                <h7>Servings:</h7>
              </div>
              <div class="col-md-3">
                <p th:text="${recipe.servings}"></p>
              </div>
            </div>
            <div class="row justify-content-center">
              <div class="col-md-3">
                <h7>Source:</h7>
              </div>
              <div class="col-md-3">
                <p th:text="${recipe.source}"></p>
              </div>
              <div class="col-md-3">
                <h7>URL:</h7>
              </div>
              <div class="col-md-3">
                <p th:text="${recipe.url}"></p>
              </div>
            </div>
          </div>
        </div>
        <div class="card card-primary border border-primary" style="margin: 20px 0;">
          <div class="card-header bg-primary text-light">
            <h7 class="card-title" >Ingredients</h7>
          </div>
          <div class="card-body">
            <div class="row justify-content-center">
              <div class="col-md-12">
<!--                <ul>-->
<!--                  <li>1 Cup of milk</li>-->
<!--                  <li>1 Teaspoon of chocolate</li>-->
<!--                  <li>1 Teaspoon of Sugar</li>-->
<!--                </ul>-->
                <tr th:each="ingredient : ${recipe.ingredients}">
                  <li th:text="${ingredient.amount} +  ' ' + ${ingredient.uom.description} + ' ' + ${ingredient.description}">123</li>
<!--                  <p><td th:text="${ingredient.amount} +  ' ' + ${ingredient.uom.description} + ' ' + ${ingredient.description}">123</td></p>-->
                </tr>
              </div>
            </div>
          </div>
        </div>
        <div class="card card-primary border border-primary" style="margin: 20px 0;">
          <div class="card-header bg-primary text-light">
            <h7 class="card-title" >Directions</h7>
          </div>
          <div class="card-body">
            <div class="row justify-content-center">
              <div class="col-md-12">
                <p th:text="${recipe.directions}"></p>
              </div>
            </div>
          </div>
        </div>
        <div class="card card-primary border border-primary" style="margin: 20px 0;">
          <div class="card-header bg-primary text-light">
            <h7 class="card-title" >Notes</h7>
          </div>
          <div class="card-body">
            <div class="row justify-content-center">
              <div class="col-md-12">
                <p th:text="${recipe.notes.recipeNotes}"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
<style>
  h7{
      font-weight: bold;
  }
</style>
